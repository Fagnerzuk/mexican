<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiro al Blanco - México</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'MexicoFont';
            src: url('mexicocss.otf') format('opentype');
            font-weight: normal;
        }
        @font-face {
            font-family: 'MexicoFont';
            src: url('mexicocssBlack.otf') format('opentype');
            font-weight: 800;
        }

        body { 
            font-family: 'MexicoFont', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex; 
            align-items: center; 
            justify-content: center;
            /* Gradiente vertical simulando as faixas da bandeira */
            background: linear-gradient(90deg, 
                #006847 33.33%, 
                #ffffff 33.33%, #ffffff 66.66%, 
                #ce1126 66.66%
            );
            background-attachment: fixed;
        }

        .blur-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px); 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
            width: 85%;
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 { font-weight: 800; }
    </style>
</head>
<body>

    <div class="blur-card">
        <h1 class="text-3xl text-green-900 mb-6">🎯 Tiro al Blanco</h1>
        
        <input id="nome" placeholder="Seu nome" class="w-full bg-black/5 border border-black/10 rounded-xl p-3 mb-4 outline-none text-center">
        
        <button onclick="iniciar()" class="w-full py-3 bg-green-800 text-white rounded-xl font-bold hover:bg-green-900 transition mb-6">
            Começar
        </button>

        <div class="flex justify-center gap-8 text-sm">
            <button onclick="toggleRanking()" class="text-green-900 font-bold uppercase">Ranking</button>
            <button onclick="showStats()" class="text-red-700 font-bold uppercase">📊 Stats</button>
        </div>
    </div>

    <script>
        let rodada = 1, total = 0, nome = "";
        let players = [];

        function iniciar() {
            nome = document.getElementById("nome").value || "Jogador";
            document.getElementById("inicio").classList.add("hidden");
            document.getElementById("jogo").classList.remove("hidden");
            document.getElementById("player").innerText = "👤 " + nome;
            atualizarBarra();
        }

        function atualizarBarra() {
            document.getElementById("rodadaTexto").innerText = "Rodada " + rodada + "/5" + (rodada > 3 ? " (x2)" : "");
            document.getElementById("barra").style.width = ((rodada - 1) / 5) * 100 + "%";
        }

        function jogar(pts) {
            if(rodada > 3) pts *= 2;
            total += pts;
            rodada++;
            if(rodada > 5) finalizar(); else atualizarBarra();
        }

        function finalizar() {
            document.getElementById("jogo").classList.add("hidden");
            document.getElementById("resultado").classList.remove("hidden");
            const msg = document.getElementById("msgMotivacional");
            msg.innerText = total >= 100 ? "¡Parabéns, você ganhou! 🏆" : "Não foi dessa vez... ¡Ánimo!";
            document.getElementById("pontosFinal").innerText = "Total: " + total + " pontos";
        }

        function salvarEReiniciar() {
            if(total >= 50) {
                players.push({name: nome, pts: total});
                players.sort((a, b) => b.pts - a.pts);
                alert("Salvo com sucesso!");
            } else { alert("Mínimo de 50 pontos para o ranking!"); }
            reiniciar();
        }

        function toggleRanking() {
            const list = document.getElementById("rankingList");
            const btn = document.getElementById("rankBtn");
            list.classList.toggle("hidden");
            btn.classList.toggle("text-yellow");
            if(!list.classList.contains("hidden")) {
                list.innerHTML = players.filter(p => p.pts >= 50).slice(0, 5).map((p, i) => 
                    `<div class="flex justify-between border-b py-1"><span>${i+1}. ${p.name}</span><span>${p.pts} pts</span></div>`
                ).join('');
            }
        }

        function showStats() {
            document.getElementById("statsModal").classList.remove("hidden");
            const g = document.getElementById("graph");
            g.innerHTML = players.map(p => `<div style="height:${(p.pts/200)*100}%" class="w-full bg-green-700"></div>`).join('');
        }

        function closeStats() { document.getElementById("statsModal").classList.add("hidden"); }
        function reiniciar() { rodada = 1; total = 0; document.querySelectorAll('.blur-card').forEach(e => e.classList.add('hidden')); document.getElementById("inicio").classList.remove("hidden"); }
                          
</script>
</body>
</html>
